name: ${APP_SLUG:-linkdownloaderbotforgroups}

services:
  linkdownloaderbot:
    # Deployment builds candidates as :candidate; :local is the running release.
    image: ${APP_SLUG:-linkdownloaderbotforgroups}:${APP_IMAGE_TAG:-local}
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    # Longer than one long-polling cycle, so shutdown never needs SIGKILL.
    stop_grace_period: 45s
