name: ${COMPOSE_PROJECT_NAME:-linkdownloaderbotforgroups}

services:
  linkdownloaderbot:
    image: linkdownloaderbotforgroups:local
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
